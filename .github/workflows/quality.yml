name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run db:start
      - name: Verify migrations without Demo data
        run: |
          npx supabase db reset --local --no-seed
          npx supabase test db supabase/tests-production/reference_data.test.sql
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run test:integration
      # Committed image baselines are Windows-only. Run every behavioral
      # assertion on Linux; visual comparison remains a separate Windows gate.
      - run: npm run test:e2e -- --ignore-snapshots --forbid-only --fail-on-flaky-tests
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - name: Stop disposable services
        if: always()
        run: npm run db:stop
